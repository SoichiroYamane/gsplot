name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned Poetry
        run: python -m pip install --disable-pip-version-check "poetry==2.4.1"

      - name: Verify the locked project metadata
        run: poetry check --lock

      - name: Build the package
        run: poetry build

      - name: Inspect package distributions
        run: python tools/maintenance/check_dist.py dist

      - name: Smoke-test the installed wheel
        env:
          MPLBACKEND: Agg
        run: |
          python -m venv "$RUNNER_TEMP/gsplot-wheel-smoke"
          "$RUNNER_TEMP/gsplot-wheel-smoke/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir --only-binary=:all: \
            "$GITHUB_WORKSPACE"/dist/gsplot-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/gsplot-wheel-smoke/bin/python" \
            "$GITHUB_WORKSPACE/tools/maintenance/smoke_dist.py" \
            --forbid-source-root "$GITHUB_WORKSPACE"

      - name: Upload package distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gsplot/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
