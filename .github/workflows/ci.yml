name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry and the locked environment
        run: |
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry install --no-interaction

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: poetry run pytest -q

      - name: Run type checks
        run: |
          poetry run mypy --config-file .mypy.ini gsplot
          poetry run pyright gsplot

  documentation:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry and the locked environment
        run: |
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry install --no-interaction

      - name: Build documentation with warnings as errors
        env:
          MPLBACKEND: Agg
        run: poetry run sphinx-build -W -b html docs docs/_build/html
