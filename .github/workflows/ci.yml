name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry and the locked environment
        run: |
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry install --no-interaction

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: poetry run pytest -q

      - name: Enforce coverage thresholds
        env:
          MPLBACKEND: Agg
        run: |
          poetry run pytest -q \
            --cov=src/gsplot/_core \
            --cov=src/gsplot/_config \
            --cov=src/gsplot/_figure \
            --cov=src/gsplot/_plot \
            --cov=src/gsplot/_style \
            --cov=src/gsplot/_io \
            --cov-report=term-missing \
            --cov-fail-under=85
          poetry run pytest -q \
            --cov=src/gsplot/_core \
            --cov-report=term-missing \
            --cov-fail-under=95

      - name: Run type checks
        run: |
          poetry run mypy --config-file .mypy.ini src/gsplot
          poetry run pyright src/gsplot

  documentation:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry and the locked environment
        run: |
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry install --no-interaction

      - name: Verify installed package boundary
        run: |
          poetry run python -c 'import gsplot; from pathlib import Path; assert Path(gsplot.__file__).parent.name == "gsplot"'

      - name: Build documentation with warnings as errors
        env:
          MPLBACKEND: Agg
        run: poetry run sphinx-build -W -b html docs docs/_build/html

  package:
    name: package and clean install
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and inspect distributions
        run: |
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry check --lock
          poetry build
          python tools/maintenance/check_dist.py dist

      - name: Smoke-test the installed wheel
        env:
          MPLBACKEND: Agg
        run: |
          python -m venv "$RUNNER_TEMP/gsplot-wheel-smoke"
          "$RUNNER_TEMP/gsplot-wheel-smoke/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir --only-binary=:all: \
            "$GITHUB_WORKSPACE"/dist/gsplot-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/gsplot-wheel-smoke/bin/python" \
            "$GITHUB_WORKSPACE/tools/maintenance/smoke_dist.py" \
            --forbid-source-root "$GITHUB_WORKSPACE"
