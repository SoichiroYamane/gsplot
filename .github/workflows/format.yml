name: Check formatting

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format:
    name: format and syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry install --no-interaction --no-root

      - name: Check Black formatting
        run: poetry run black --check gsplot tests scripts docs/conf.py --exclude 'gsplot/version\.py'

      - name: Check import ordering
        run: poetry run isort --profile black --check-only gsplot tests scripts docs/conf.py

      - name: Check Python syntax
        run: poetry run python -m compileall -q gsplot tests scripts
