name: Dependency security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# CodeQL Default setup analyzes this workflow separately for unsafe patterns.
permissions:
  contents: read

jobs:
  pip-audit:
    name: audit locked Python environment
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry and the locked environment
        run: |
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry check --lock
          poetry install --no-interaction

      - name: Audit installed dependencies
        run: poetry run pip-audit --local
