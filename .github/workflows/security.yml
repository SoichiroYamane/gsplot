name: Dependency security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: audit locked Python environment
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Poetry and the locked environment
        run: |
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry install --no-interaction

      - name: Audit installed dependencies
        run: poetry run pip-audit --local
