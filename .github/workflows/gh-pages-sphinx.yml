name: GitHub Pages

on:
  push:
    branches:
      - "main"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install pinned Poetry
        run: python -m pip install --disable-pip-version-check "poetry==2.4.1"

      - name: Verify Poetry version
        run: poetry --version

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Create switcher.json
        run: |
          cd docs/_static
          poetry run python create_switcher.py

      - name: Build with Sphinx
        run: |
          export MPLBACKEND=Agg
          poetry run make -C docs clean
          poetry run make -C docs html-dev-deploy

      - name: Run docs/multiversions.sh
        run: |
          cd docs
          poetry run bash multiversions.sh

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site

      - name: Clean _site directory
        run: |
          chmod -R u+rwX ./_site
          find ./_site -type f -name "README.md" -delete


      - name: Copy latest version as stable
        run: |
          echo "Finding the latest version..."
          latest_version="$(sort -V docs/versions | tail -n 1)"
          echo "Latest version detected: $latest_version"

          echo "Copying the latest version to stable..."
          test -n "$latest_version"
          mkdir -p ./docs/_build/html/stable
          cp -r "./docs/_build/html/$latest_version/"* ./docs/_build/html/stable/

      - name: Combine Sphinx and Jekyll Outputs
        run: |
          mkdir -p ./_site/docs
          cp -r ./docs/_build/html/* ./_site/docs/


      - name: Upload combined output as GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./_site/docs

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
