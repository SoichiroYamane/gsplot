name: GitHub Pages

on:
  push:
    branches:
      - "main"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned Poetry
        run: python -m pip install --disable-pip-version-check "poetry==2.4.1"

      - name: Verify Poetry version
        run: poetry --version

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Create switcher.json
        run: |
          cd docs/_static
          poetry run python create_switcher.py

      - name: Build with Sphinx
        run: |
          export MPLBACKEND=Agg
          poetry run make -C docs clean
          poetry run make -C docs html-dev-deploy

      - name: Run docs/multiversions.sh
        run: |
          cd docs
          poetry run bash multiversions.sh

      - name: Copy latest version as stable
        run: |
          echo "Finding the latest version..."
          latest_version="$(sort -V docs/versions | tail -n 1)"
          echo "Latest version detected: $latest_version"

          echo "Copying the latest version to stable..."
          test -n "$latest_version"
          mkdir -p ./docs/_build/html/stable
          cp -r "./docs/_build/html/$latest_version/"* ./docs/_build/html/stable/

      - name: Stage Sphinx output for Pages
        run: |
          mkdir -p ./_site/docs
          cp -r ./docs/_build/html/* ./_site/docs/


      - name: Upload combined output as GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site/docs

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
