name: GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "Existing tag to validate as an unpublished release candidate"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gsplot-pages
  cancel-in-progress: false

env:
  GSPLOT_DOCS_BASE_URL: ${{ vars.GSPLOT_DOCS_BASE_URL || 'https://soichiroyamane.github.io/gsplot' }}

jobs:
  catalog:
    name: catalog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source and release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry and the locked environment
        run: |
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry install --no-interaction

      - name: Prepare catalog directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gsplot-catalog"

      - name: Build pull-request fixture catalog
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          poetry run python -m tools.maintenance.build_docs_catalog \
            --repo-root "$GITHUB_WORKSPACE" \
            --fixture tests/fixtures/docs_site/releases.json \
            --base-url "https://example.test/gsplot" \
            --output "$RUNNER_TEMP/gsplot-catalog/catalog.json" \
            --switcher-output "$RUNNER_TEMP/gsplot-catalog/switcher.json"

      - name: Build live catalog
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GSPLOT_CANDIDATE_TAG: ${{ inputs.candidate_tag || '' }}
        run: |
          set -euo pipefail
          catalog_args=(
            --repo-root "$GITHUB_WORKSPACE"
            --base-url "$GSPLOT_DOCS_BASE_URL"
            --output "$RUNNER_TEMP/gsplot-catalog/catalog.json"
            --switcher-output "$RUNNER_TEMP/gsplot-catalog/switcher.json"
          )
          if [[ -n "$GSPLOT_CANDIDATE_TAG" ]]; then
            catalog_args+=(--candidate-tag "$GSPLOT_CANDIDATE_TAG")
          else
            catalog_args+=(
              --previous-manifest-url
              "$GSPLOT_DOCS_BASE_URL/_meta/build-manifest.json"
            )
          fi
          poetry run python -m tools.maintenance.build_docs_catalog \
            "${catalog_args[@]}"

      - name: Upload catalog artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gsplot-docs-catalog
          path: ${{ runner.temp }}/gsplot-catalog
          if-no-files-found: error
          retention-days: 7

  build:
    name: isolated versioned build
    needs: catalog
    if: ${{ needs.catalog.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source and release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated catalog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gsplot-docs-catalog
          path: ${{ runner.temp }}/gsplot-catalog

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/maintenance/docs_site/package-lock.json

      - name: Install Poetry and the locked environment
        run: |
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry install --no-interaction

      - name: Install the locked Mermaid CLI toolchain
        run: |
          set -euo pipefail
          export PUPPETEER_SKIP_DOWNLOAD=true
          npm --prefix tools/maintenance/docs_site ci --ignore-scripts
          npm --prefix tools/maintenance/docs_site audit --omit=dev --audit-level=high
          node_bin="$GITHUB_WORKSPACE/tools/maintenance/docs_site/node_modules/.bin"
          echo "$node_bin" >> "$GITHUB_PATH"
          export PATH="$node_bin:$PATH"
          chrome_path="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_path"
          echo "GSPLOT_MERMAID_CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
          mmdc --version

      - name: Build and validate the complete site
        env:
          MPLBACKEND: Agg
          GSPLOT_CANDIDATE_TAG: ${{ inputs.candidate_tag || '' }}
        run: |
          set -euo pipefail
          site_base_url="$GSPLOT_DOCS_BASE_URL"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            site_base_url="https://example.test/gsplot"
          fi
          site_dir="$RUNNER_TEMP/gsplot-site"
          poetry run python -m tools.maintenance.build_docs_site \
            --repo-root "$GITHUB_WORKSPACE" \
            --catalog "$RUNNER_TEMP/gsplot-catalog/catalog.json" \
            --output "$site_dir" \
            --base-url "$site_base_url"
          poetry run python tools/maintenance/check_docs_artifact.py \
            --manifest "$site_dir/_meta/build-manifest.json" \
            --baseline tools/maintenance/docs_site/artifact-baseline.json
          metadata_dir="$RUNNER_TEMP/gsplot-docs-metadata"
          mkdir -p "$metadata_dir"
          cp "$site_dir/_meta/catalog.json" "$metadata_dir/catalog.json"
          cp "$site_dir/_meta/build-manifest.json" "$metadata_dir/build-manifest.json"

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' && !inputs.candidate_tag }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/gsplot-site

      - name: Upload build metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gsplot-docs-metadata
          path: ${{ runner.temp }}/gsplot-docs-metadata
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: deploy Pages artifact
    needs: [catalog, build]
    if: ${{ github.event_name != 'pull_request' && !inputs.candidate_tag && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  smoke:
    name: smoke-test deployed site
    needs: [catalog, build, deploy]
    if: ${{ github.event_name != 'pull_request' && !inputs.candidate_tag && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out smoke-test code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Download build metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gsplot-docs-metadata
          path: ${{ runner.temp }}/gsplot-docs-metadata

      - name: Verify deployed public endpoints
        run: |
          python -m tools.maintenance.smoke_docs_site \
            --base-url "$GSPLOT_DOCS_BASE_URL" \
            --catalog "$RUNNER_TEMP/gsplot-docs-metadata/catalog.json" \
            --manifest "$RUNNER_TEMP/gsplot-docs-metadata/build-manifest.json" \
            --attempts 12 \
            --delay 10 \
            --timeout 15
