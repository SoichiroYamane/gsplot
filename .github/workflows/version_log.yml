# .github/workflows/version_log.yml
name: Build and Save Version Info

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - "gsplot/version.py"

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    concurrency:
      group: version-metadata
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The trusted main workflow needs the token only for the fixed
          # automation/version-metadata branch push.
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned Poetry
        run: python -m pip install --disable-pip-version-check "poetry==2.4.1"

      - name: Verify Poetry version
        run: poetry --version

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Get Git commit hash
        run: echo "COMMIT_HASH=${GITHUB_SHA}" >> "$GITHUB_ENV"


      - name: Get package version
        run: |
          VERSION="$(poetry version -s)"
          echo "PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Write version info to file
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          COMMIT_HASH: ${{ env.COMMIT_HASH }}
        run: |
          printf "__version__ = '%s'\n" "$PACKAGE_VERSION" > gsplot/version.py
          printf "__commit__ = '%s'\n" "$COMMIT_HASH" >> gsplot/version.py

      - name: Push version metadata branch for pull request handoff
        env:
          VERSION_BRANCH: automation/version-metadata
        run: |
          set -euo pipefail

          if git diff --quiet -- gsplot/version.py; then
            echo "Version metadata is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$VERSION_BRANCH"
          git add gsplot/version.py
          git commit --message "chore: update version metadata"

          git fetch origin "$VERSION_BRANCH" || true
          git push --force-with-lease origin "HEAD:$VERSION_BRANCH"

          VERSION_COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/main...${VERSION_BRANCH}?expand=1"
          {
            echo "## Version metadata is ready for pull request review"
            echo
            echo "The restricted Actions token intentionally does not create or approve pull requests."
            echo "The generated branch \`${VERSION_BRANCH}\` was pushed successfully."
            echo
            echo "[Open a normal pull request from the generated branch](${VERSION_COMPARE_URL})"
            echo
            echo "Review and merge it through the protected \`main\` workflow using the public Issue, Review 1, and Review 2 protocol. After both reviews and required checks pass, eligible generated metadata may use GitHub auto-merge."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Version metadata PR required::Open ${VERSION_COMPARE_URL}, review the generated metadata, and use auto-merge only after the public review and required-check gate."

      - name: Build package
        run: poetry build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
