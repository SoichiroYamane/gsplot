# .github/workflows/build.yml
name: Build and Save Version Info

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install pinned Poetry
        run: python -m pip install --disable-pip-version-check "poetry==2.4.1"

      - name: Verify Poetry version
        run: poetry --version

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Get Git commit hash
        run: echo "COMMIT_HASH=${GITHUB_SHA}" >> "$GITHUB_ENV"


      - name: Get package version
        run: |
          VERSION="$(poetry version -s)"
          echo "PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Write version info to file
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          COMMIT_HASH: ${{ env.COMMIT_HASH }}
        run: |
          printf "__version__ = '%s'\n" "$PACKAGE_VERSION" > gsplot/version.py
          printf "__commit__ = '%s'\n" "$COMMIT_HASH" >> gsplot/version.py

      - name: Commit and push changes
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9
        with:
          message: "Update version.py with build information"
          add: "gsplot/version.py"

      - name: Build package
        run: poetry build

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*
