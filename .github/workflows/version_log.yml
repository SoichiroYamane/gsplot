# .github/workflows/build.yml
name: Build and Save Version Info

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned Poetry
        run: python -m pip install --disable-pip-version-check "poetry==2.4.1"

      - name: Verify Poetry version
        run: poetry --version

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Get Git commit hash
        run: echo "COMMIT_HASH=${GITHUB_SHA}" >> "$GITHUB_ENV"


      - name: Get package version
        run: |
          VERSION="$(poetry version -s)"
          echo "PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Write version info to file
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          COMMIT_HASH: ${{ env.COMMIT_HASH }}
        run: |
          printf "__version__ = '%s'\n" "$PACKAGE_VERSION" > gsplot/version.py
          printf "__commit__ = '%s'\n" "$COMMIT_HASH" >> gsplot/version.py

      - name: Commit and push changes
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
        with:
          message: "Update version.py with build information"
          add: "gsplot/version.py"

      - name: Build package
        run: poetry build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
